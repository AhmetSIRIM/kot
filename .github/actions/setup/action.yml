name: Setup build environment
description: The JDK and Gradle setup every job shares; jobs stay one uses-line away from it.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '17'

    # Wires Gradle build caching into Actions; dependency downloads are paid once per cache key.
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
