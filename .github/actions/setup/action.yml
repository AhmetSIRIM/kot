name: Setup build environment
description: The JDK and Gradle setup every job shares; jobs stay one uses-line away from it.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '17'

    # Wires Gradle build caching into Actions; dependency downloads are paid once per cache key.
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
