name: Setup build environment
description: The JDK and Gradle setup every job shares; jobs stay one uses-line away from it.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: '17'

    # Wires Gradle build caching into Actions; dependency downloads are paid once per cache key.
    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
