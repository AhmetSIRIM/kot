version: 2
updates:
  # The version catalog and plugin versions.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Europe/Istanbul"
    # Deliberate policy, not a stale suppression: the compileOnly AGP pin stays at the floor
    # (the wiring compiles against the 8.1 Variants API; see the README's Compatibility
    # section), so major/minor bumps of gradle-api only propose breaking that commitment.
    # Patch bumps stay allowed (same API surface). Security ALERTS are unaffected: they flow
    # from the dependency graph, not from this version-update schedule.
    ignore:
      - dependency-name: com.android.tools.build:gradle-api
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # A quiet week costs one review instead of one per dependency. Majors are left out of the
      # group on purpose: widening the toolchain is the decision this project exists to make
      # visible, and it earns its own review surface.
      minor-and-patch:
        update-types: ["minor", "patch"]
      # CVE-triggered updates arrive as one PR per ecosystem instead of one per advisory.
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  # Action versions. The workflow files live at the root; the setup composite pins its own
  # actions and is a separate ecosystem root, invisible to the root entry.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Europe/Istanbul"
    groups:
      # Grouping collapses per-dependency PRs, not per-directory ones: an action pinned in
      # both roots still arrives as one PR per root.
      minor-and-patch:
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
