name: Dependency Graph

# GitHub cannot parse Gradle builds statically (version catalogs and dynamic resolution defeat
# manifest parsing), so Dependabot alerts see the library dependencies only through this
# submission. The submitted tree is the resolved one, transitives included.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  submit-dependency-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # The Dependency Submission API stores a snapshot on the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-java directly instead of the setup composite: dependency-submission embeds its
      # own Gradle provisioning, so the composite's setup-gradle step would double-initialize.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve and submit the dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
