name: PR Check

on:
  pull_request:
    branches: [main]

# A superseded push to the same PR cancels the run it replaces; only the latest commit's
# verdict matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the repository; granting nothing else keeps a compromised dependency
# from writing back.
permissions:
  contents: read

jobs:
  # Its own job on purpose: the verdict lands before the functional suite finishes, and a red
  # here names the failure class (a broken contract, not build behavior) from the checks list.
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run unit tests
        run: ./gradlew test --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: unit-test-reports
          path: build/reports/tests/test/

  # The real-AGP end-to-end tests need an Android SDK; the ubuntu runner image ships one.
  functional-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Cold caches pay the AGP dependency downloads; a hung daemon must not run for the default 6 hours.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run functional tests
        run: ./gradlew functionalTest --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: functional-test-reports
          path: build/reports/tests/functionalTest/

  detekt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run detekt
        run: ./gradlew detekt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: detekt-reports
          path: build/reports/detekt/

  # The static ring of publish validation: task annotations and the plugin descriptor.
  # The Portal's own verdict on the publication (required listing metadata, the sources and
  # javadoc wiring, live credentials) is left to the release run on purpose: asking the Portal
  # needs the publish keys, and a pull request build runs dependency code nobody has read, so
  # the keys stay out of it.
  publish-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate plugin metadata
        run: ./gradlew validatePlugins

  # The other jobs guard the code; this one guards the pipeline itself.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }} # Lets zizmor resolve pinned SHAs against the owning repos.
        run: pipx run zizmor==1.27.0 --no-progress .github/workflows .github/actions

  # The one job branch protection marks as required: green only when every job above is.
  summary:
    needs: [unit-test, functional-test, detekt, publish-validation, workflow-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # skipped counts as failed here: branch protection treats a skipped required check as
      # passed, so a dependency that silently stopped running must turn this gate red.
      - name: Fail unless every dependency succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
