name: Scorecard

# The README badge reads the published result, and the SARIF upload turns findings into code
# scanning alerts. Weekly plus on push to main, so the score follows the configuration it grades.
on:
  schedule:
    - cron: '23 7 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # Uploads the SARIF findings to code scanning.
      id-token: write # The publish step proves the run's identity to the Scorecard API (OIDC).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload the findings to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
